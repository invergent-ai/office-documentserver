name: Build office-docs image

# Builds Euro-Office's cluster-docs image from this branch, with server, sdkjs
# and web-apps taken from the invergent-ai forks pinned in .gitmodules, and
# pushes it to ghcr.io/invergent-ai/office-docs as :<short sha> and
# :<VERSION>-surogate. Same bake graph as build.yml, one arch, one brand, no
# packages/e2e. A cold build takes about 2 h on ubuntu-latest (core ~85 min).

on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Rebuild every layer cold (ignore the registry build cache)'
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Compute version
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "product_version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          git submodule status

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cluster-docs
        id: bake
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5.13.0
        with:
          workdir: ./build
          files: |
            ./docker-bake.hcl
            ./docker-bake.surogate.hcl
          targets: cluster-docs
          # Only cluster-docs has a registry output (docker-bake.surogate.hcl).
          push: false
          no-cache: ${{ inputs.no_cache }}
          pull: ${{ inputs.no_cache }}
          # Every target's context is the repo root, as in build.yml.
          set: |
            *.context=..
        env:
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          PRODUCT_VERSION: ${{ steps.meta.outputs.product_version }}
          BUILD_NUMBER: '0'
          # Browser cache tag for api.js and nginx; a new value per build makes
          # clients drop cached sdkjs/web-apps assets after an upgrade.
          DS_VERSION_HASH: ${{ steps.meta.outputs.short_sha }}
          NUGET_CACHE: local

      - name: Report image
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          PRODUCT_VERSION: ${{ steps.meta.outputs.product_version }}
        run: |
          digest=$(jq -r '."cluster-docs"."containerimage.digest"' <<<"$METADATA")
          {
            echo "### ghcr.io/invergent-ai/office-docs"
            echo
            echo "- \`:${SHORT_SHA}\`, \`:${PRODUCT_VERSION}-surogate\`"
            echo "- digest \`${digest}\`"
            echo
            echo "\`ghcr.io/invergent-ai/office-docs:${PRODUCT_VERSION}-surogate@${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
